name: Android Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          yes | "$CMDLINE" --licenses > /dev/null || true
          "$CMDLINE" "platforms;android-36" "build-tools;36.0.0"

      - name: 编译 Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 启动模拟器、抓日志并截图
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell wm dismiss-keyguard || true
            adb shell input keyevent 82 || true
            adb logcat -c
            adb shell am start -W -n com.metalheart.zhimai/.MainActivity || true
            sleep 60
            adb exec-out screencap -p > screen-60s.png
            sleep 60
            adb exec-out screencap -p > screen-120s.png
            echo "===== PID ====="
            adb shell pidof com.metalheart.zhimai || true
            echo "===== WINDOW ====="
            adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" || true
            echo "===== ACTIVITY ====="
            adb shell dumpsys activity activities | grep -E "ResumedActivity|mFocusedApp|state=" | head -n 20 || true
            echo "===== ANR/FATAL ====="
            adb logcat -d | grep -E "FATAL|AndroidRuntime|ANR in|chromium|WebView|Zhimai|zhimai" | tail -n 120 || true
            adb logcat -d > logcat-full.txt || true
            adb logcat -d -b crash > logcat-crash.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: |
            screen-60s.png
            screen-120s.png
            logcat-full.txt
            logcat-crash.txt
          if-no-files-found: warn
