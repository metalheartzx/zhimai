name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "app.css"
      - "sw.js"
      - "manifest.webmanifest"
      - "js/**"
      - "data/**"
      - "assets/**"
      - ".github/workflows/android.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          CMDLINE=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)
          echo "sdkmanager=$CMDLINE"
          echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          yes | "$CMDLINE" --licenses > /dev/null || true
          "$CMDLINE" "platforms;android-36" "build-tools;36.0.0"

      - name: 编译 Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: zhimai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
